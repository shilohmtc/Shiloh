name: Calendar Phone Column Toggle Proof

on:
  pull_request:
    paths:
      - 'src/presentation/calendarPhoneAllStaffUx.js'
      - 'tests/calendar-phone-all-staff-v1.test.js'
      - 'scripts/calendar-phone-column-toggle-browser-proof.js'
      - '.github/workflows/calendar-phone-operational-cleanup-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone_calendar_columns:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Run focused Phone Calendar column tests
        run: node --test tests/calendar-phone-all-staff-v1.test.js
      - name: Prove Phone Calendar columns and toggles in Chrome
        run: node scripts/calendar-phone-column-toggle-browser-proof.js
      - name: Upload Phone Calendar column proof
        uses: actions/upload-artifact@v6
        with:
          name: calendar-phone-column-toggle-v1
          path: artifacts/calendar-phone-column-toggle-v1
          if-no-files-found: error
          retention-days: 14
