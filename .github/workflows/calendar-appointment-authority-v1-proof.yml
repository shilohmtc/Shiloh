name: Calendar Appointment Authority V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  appointment_authority_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Run focused authority regressions
        run: node --test tests/calendar-appointment-authority-v1.test.js tests/calendar-appointment-treatment-price-v1.test.js
      - name: Verify installed Chrome for authority proof
        shell: bash
        run: |
          set -euo pipefail
          # The unchanged authority proof prefers these installed browsers.
          chrome_binary="${CHROME_BIN:-}"
          if [ -z "$chrome_binary" ]; then
            for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium; do
              if [ -x "$candidate" ]; then
                chrome_binary="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chrome_binary" ] || [ ! -x "$chrome_binary" ]; then
            echo "::error::An executable installed Chrome or Chromium is required for the authority proof."
            exit 1
          fi
          browser_version="$("$chrome_binary" --version)"
          case "$browser_version" in
            *Chrome*|*Chromium*) ;;
            *) echo "::error::The installed browser did not identify itself as Chrome or Chromium."; exit 1 ;;
          esac
          mkdir -p artifacts/calendar-appointment-authority-v1
          printf 'Executable: %s\nVersion: %s\n' "$chrome_binary" "$browser_version" | tee artifacts/calendar-appointment-authority-v1/browser-environment.txt
          printf 'CHROME_BIN=%s\n' "$chrome_binary" >> "$GITHUB_ENV"
      - name: Prove Phone and Desktop appointment authority UX
        run: npm run test:browser:appointment-authority
      - name: Upload Phone and Desktop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calendar-appointment-authority-v1-evidence
          path: artifacts/calendar-appointment-authority-v1
          if-no-files-found: error
          retention-days: 14
