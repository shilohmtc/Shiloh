name: Shiloh system maintenance check

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:17 South African time; Monday follows Dependabot's check.
    - cron: '17 7 * * *'
  pull_request:
    branches: [main]
    paths:
      - scripts/system-maintenance-check.js
      - scripts/verify-code-snapshot.js
      - scripts/independent-code-backup.js
      - tests/system-maintenance-check.test.js
      - tests/independent-code-backup.test.js
      - .github/workflows/system-maintenance.yml

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test maintenance failure handling
        run: node --test tests/system-maintenance-check.test.js tests/independent-code-backup.test.js
      - name: Fetch current branch and tag inventory
        if: github.event_name != 'pull_request'
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Create and prove code recovery checkpoint
        if: github.event_name != 'pull_request'
        run: npm run system:snapshot
      - name: Copy code to private Drive and restore the downloaded copy
        if: github.event_name != 'pull_request'
        env:
          # Dedicated backup OAuth credentials; never reuse Calendar credentials.
          SHILOH_BACKUP_GOOGLE_CLIENT_ID: ${{ secrets.SHILOH_BACKUP_GOOGLE_CLIENT_ID }}
          SHILOH_BACKUP_GOOGLE_CLIENT_SECRET: ${{ secrets.SHILOH_BACKUP_GOOGLE_CLIENT_SECRET }}
          SHILOH_BACKUP_GOOGLE_REFRESH_TOKEN: ${{ secrets.SHILOH_BACKUP_GOOGLE_REFRESH_TOKEN }}
        run: npm run system:backup:code
      - name: Check Shiloh software and release state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Configure separately in GitHub Secrets. Never expose to PR code.
          RENDER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.SHILOH_MAINTENANCE_RENDER_API_KEY || '' }}
        run: npm run system:check
      - name: Retain report and code checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shiloh-maintenance-${{ github.run_id }}
          path: artifacts/system-maintenance/
          retention-days: 30
          if-no-files-found: error
