name: Workspace Clinic Hours V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clinic_hours_exact_head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused Clinic hours security and orchestration tests
        run: node --test tests/workspace-clinic-hours-v1.test.js
      - name: Run authenticated Desktop and Phone Clinic hours proof
        run: node scripts/workspace-clinic-hours-browser-proof.js
      - name: Upload authenticated Clinic hours proof
        uses: actions/upload-artifact@v6
        with:
          name: workspace-clinic-hours-v1
          path: artifacts/workspace-clinic-hours-v1
          if-no-files-found: error
          retention-days: 14
