name: Calendar Phone Multi-Staff Columns Proof

on:
  pull_request:
    paths:
      - 'src/presentation/calendarPhoneAllStaffUx.js'
      - 'src/presentation/calendarPhoneRoomierUx.js'
      - 'scripts/calendar-phone-roomier-browser-proof.js'
      - 'src/presentation/calendarPhoneDisplayRange.js'
      - 'src/presentation/calendarPhoneCompactV2.js'
      - 'src/presentation/calendarAppointmentDetailsUx.js'
      - 'scripts/calendar-phone-working-day-browser-proof.js'
      - 'scripts/calendar-phone-working-day-fixture.js'
      - 'src/services/workspaceNavigation.js'
      - 'src/presentation/workspaceShell.js'
      - 'src/routes/calendar.js'
      - 'tests/calendar-phone-all-staff-v1.test.js'
      - 'scripts/calendar-phone-column-toggle-browser-proof.js'
      - 'scripts/calendar-phone-viewport-fit-browser-proof.js'
      - 'scripts/workspace-calendar-entry-browser-proof.js'
      - '.github/workflows/calendar-phone-all-staff-columns-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone_multi_staff_columns:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Run focused Phone multi-staff column tests
        run: node --test tests/calendar-phone-all-staff-v1.test.js
      - name: Prove Workspace to Calendar entry journey in Chrome
        run: node scripts/workspace-calendar-entry-browser-proof.js
      - name: Prove Phone multi-staff columns and toggles in Chrome
        run: node scripts/calendar-phone-column-toggle-browser-proof.js
      - name: Prove Phone viewport-fit Week and contextual Today in Chrome
        run: node scripts/calendar-phone-viewport-fit-browser-proof.js
      - name: Prove agreed working-day geometry, filters, details, Notes and accessibility
        run: node scripts/calendar-phone-working-day-browser-proof.js
      - name: Prove optional Roomier geometry, scroll offsets, keyboard, Notes and accessibility
        run: node scripts/calendar-phone-roomier-browser-proof.js
      - name: Upload Phone multi-staff column proof
        uses: actions/upload-artifact@v6
        with:
          name: calendar-phone-multi-staff-columns-v1
          path: |
            artifacts/calendar-phone-column-toggle-v1
            artifacts/calendar-phone-viewport-fit-v1
            artifacts/calendar-phone-working-day
            artifacts/calendar-phone-roomier
          if-no-files-found: error
          retention-days: 14
