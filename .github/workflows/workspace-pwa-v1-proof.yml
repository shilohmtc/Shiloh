name: Workspace PWA V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa_v1_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused Workspace PWA security tests
        run: node --test tests/workspace-pwa-v1.test.js
      - name: Run authenticated Workspace PWA Desktop and Phone proof
        run: node scripts/workspace-pwa-v1-browser-proof.js
      - name: Upload Workspace PWA proof
        uses: actions/upload-artifact@v6
        with:
          name: workspace-pwa-v1
          path: artifacts/workspace-pwa-v1
          if-no-files-found: error
          retention-days: 14
