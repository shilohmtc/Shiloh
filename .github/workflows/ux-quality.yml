name: UX Visual + Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ux_quality:
    runs-on: ubuntu-latest
    # Preserve the full UX suite and evidence packaging on slower runners.
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production-backed Storybook catalogue
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: npm run build-storybook -- --quiet
      - name: Start static Storybook
        run: |
          python3 -m http.server 6006 --directory storybook-static > /tmp/shiloh-storybook.log 2>&1 &
          echo $! > /tmp/shiloh-storybook.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6006/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/shiloh-storybook.log
          exit 1
      - name: Prove booking for two on Phone and Desktop
        run: npx playwright test tests/my-shiloh-couples-ux.spec.js --config=playwright.ux.config.js
      - name: Prove ordinary booking entry accessibility
        run: npx playwright test tests/ux-visual-accessibility.spec.js --config=playwright.ux.config.js --grep 'My Shiloh multiple bookings review'
      - name: Prove CRM sign-in on Phone and Desktop
        run: npx playwright test tests/my-shiloh-crm-sign-in-ux.spec.js --config=playwright.ux.config.js
      - name: Bind focused CRM authentication screenshots to exact head
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package-my-shiloh-crm-auth-evidence.js
      - name: Upload focused synthetic CRM authentication review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: my-shiloh-crm-auth-review
          path: artifacts/my-shiloh-crm-auth-review
          if-no-files-found: error
          retention-days: 14
      - name: Compare reviewed baselines and run accessibility checks
        id: ux_check
        shell: bash
        run: |
          if compgen -G 'tests/ux-baselines/*.png.b64.part*' > /dev/null; then
            node scripts/ux-baseline-codec.js decode
            npm run test:ux
          else
            echo 'No committed reviewed UX baselines found; generating candidate baselines only.'
            npm run test:ux -- --update-snapshots
            node scripts/ux-baseline-codec.js encode
            mkdir -p artifacts/ux-baseline-candidate
            cp tests/ux-baselines/*.png artifacts/ux-baseline-candidate/
            cp tests/ux-baselines/*.png.b64.part* artifacts/ux-baseline-candidate/
            echo 'Candidate baselines generated. Review the PNGs and commit only approved .png.b64.part* fixtures deliberately.'
            exit 1
          fi
      - name: Package small My Shiloh sign-in review
        run: node scripts/package-my-shiloh-signin-evidence.js
      - name: Prove Phone Calendar first paint in Chromium
        run: npx playwright test tests/calendar-phone-first-paint.spec.js --config=.
      - name: Package focused paid-booking payment review
        run: node scripts/package-paid-booking-payment-evidence.js
      - name: Upload focused paid-booking payment review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-booking-payment-review
          path: artifacts/paid-booking-payment
          if-no-files-found: error
          retention-days: 14
      - name: Upload focused South African phone review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: south-african-phone-review
          path: artifacts/south-african-phone/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Bind payment method and client Credit review to exact source
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_PROVENANCE: github-actions-synthetic
        run: node scripts/payment-method-client-credit-evidence.js
      - name: Upload payment method and client Credit review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payment-method-client-credit-review
          path: artifacts/payment-method-client-credit
          if-no-files-found: error
          retention-days: 14
      - name: Upload UX evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-visual-accessibility-evidence
          path: |
            artifacts/payment-method-client-credit/*.png
            artifacts/paid-booking-payment/*.png
            artifacts/treatment-credit/*.png
            artifacts/ux-playwright-results
            artifacts/ux-playwright-report
            artifacts/workspace-deposits
            artifacts/ux-baseline-candidate
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload small My Shiloh sign-in review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: my-shiloh-signin-focused-review
          path: artifacts/my-shiloh-signin-review
          if-no-files-found: error
          retention-days: 14
      - name: Upload booking-for-two visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: my-shiloh-couples-visual-review
          path: artifacts/ux-playwright-results/**/couples-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Workspace deposit visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-deposit-visual-review
          path: artifacts/workspace-deposits/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload focused Workspace polish visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-polish-visual-review
          path: |
            artifacts/workspace-polish
            artifacts/workspace-action-standard
            artifacts/ux-playwright-results/**/dashboard-*.png
            artifacts/ux-playwright-results/**/client-history-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload synthetic consultation review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consultation-handover-review
          path: |
            artifacts/ux-playwright-results/**/phone-*.png
            artifacts/ux-playwright-results/**/tablet-*.png
            artifacts/ux-playwright-results/**/desktop-*.png
            artifacts/ux-playwright-results/**/clinic-ipad-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Bind focused credit and booking-payment screenshots to exact source
        if: success()
        env:
          EVIDENCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_PROVENANCE: github-actions-synthetic
        run: node scripts/treatment-credit-evidence-manifest.js
      - name: Upload focused credit and booking-payment review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: treatment-credit-booking-payment-review
          path: |
            artifacts/payment-method-client-credit/*.png
            artifacts/paid-booking-payment/*.png
            artifacts/treatment-credit/*.png
            artifacts/treatment-credit/manifest.json
            artifacts/ux-playwright-results/client-treatment-credit-*/test-failed-*.png
            artifacts/ux-playwright-results/client-treatment-credit-*/trace.zip
            artifacts/ux-playwright-results/client-treatment-credit-*/error-context.md
          if-no-files-found: error
          retention-days: 14
