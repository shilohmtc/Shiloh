name: Deposit Payment Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/deposit-payment-safety]

permissions:
  contents: read

concurrency:
  group: deposit-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deposit_safety_exact_head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Package exact source for review
        run: |
          git archive --format=tar.gz --output=/tmp/shiloh-payment-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/shiloh-payment-head.txt
          git rev-parse HEAD^{tree} > /tmp/shiloh-payment-tree.txt
      - name: Upload exact source review artifact
        uses: actions/upload-artifact@v7
        with:
          name: deposit-safety-source
          path: |
            /tmp/shiloh-payment-source.tar.gz
            /tmp/shiloh-payment-head.txt
            /tmp/shiloh-payment-tree.txt
          retention-days: 2
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package dependencies for offline review
        run: tar -czf /tmp/shiloh-payment-dependencies.tar.gz node_modules
      - name: Upload offline review dependencies
        uses: actions/upload-artifact@v7
        with:
          name: deposit-safety-dependencies
          path: /tmp/shiloh-payment-dependencies.tar.gz
          retention-days: 2
      - name: Run deposit safety regressions
        run: node --test tests/deposit-payment-safety.test.js tests/payment-whatsapp-wiring.test.js tests/payment-meta-template-pack.test.js tests/customer-change-notifications.test.js tests/my-shiloh-push-v1.test.js tests/booking-deposit-policy.test.js
