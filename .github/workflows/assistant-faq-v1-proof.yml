name: Assistant Knowledge FAQ V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assistant_faq_exact_head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run curated Assistant FAQ evaluation cases
        run: node scripts/assistant-faq-eval.js
      - name: Run Assistant Knowledge and FAQ authority tests
        run: node --test tests/assistant-faq-v1.test.js
      - name: Validate synthetic model comparison boundaries without API calls
        run: node --test tests/assistant-model-review.test.js
      - name: Prepare offline model comparison manifest
        run: npm run ai:review:preflight
