name: Workspace Reports UI Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reports_ui_exact_head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shiloh_financial_test
          POSTGRES_USER: financial_test
          POSTGRES_PASSWORD: synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_test -d shiloh_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused Reports access and presentation tests
        run: node --test tests/workspace-reports-v1.test.js tests/workspace-staff-earnings.test.js tests/workspace-financial-reports.test.js tests/workspace-financial-records.test.js
      - name: Execute financial queries against isolated PostgreSQL fixtures
        env:
          FINANCIAL_PROOF_DATABASE_URL: postgres://financial_test:synthetic_test_only@127.0.0.1:5432/shiloh_financial_test
        run: |
          node scripts/workspace-financial-postgres-proof.js
          node scripts/workspace-financial-records-postgres-proof.js
      - name: Build production-backed Storybook catalogue
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: npm run build-storybook -- --quiet
      - name: Start static Storybook
        run: |
          python3 -m http.server 6006 --directory storybook-static > /tmp/shiloh-reports-storybook.log 2>&1 &
          echo $! > /tmp/shiloh-reports-storybook.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6006/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/shiloh-reports-storybook.log
          exit 1
      - name: Run Reports Storybook accessibility proof on Desktop and Phone
        run: npx playwright test --config=playwright.reports.config.js
      - name: Run authenticated Reports Playwright proof on Desktop and Phone
        run: node scripts/workspace-reports-authenticated-playwright.js
      - name: Upload Reports UX evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workspace-reports-ui-proof
          path: |
            artifacts/workspace-reports-ui
            artifacts/workspace-reports-storybook
            artifacts/workspace-reports-storybook-report
          if-no-files-found: error
          retention-days: 14
