name: Staff Passkey Auth V1 Proof

on:
  pull_request:
    paths:
      - 'migrations/111_staff_passkey_auth_v1.sql'
      - 'migrations/112_staff_passkey_auth_v1_production_schema_correction.sql'
      - 'migrations/113_staff_whatsapp_passkey_bootstrap_v1.sql'
      - 'migrations/117_workspace_device_recovery_v1.sql'
      - 'migrations/118_workspace_self_passkey_bootstrap.sql'
      - 'src/services/staffPasskeyAuth.js'
      - 'src/services/staffWhatsAppPasskeyBootstrap.js'
      - 'src/services/workspaceReceptionDeviceSignin.js'
      - 'src/middleware/staffWhatsAppPasskeyBootstrap.js'
      - 'src/routes/staffPasskeyAuth.js'
      - 'src/routes/staffPasskeyBootstrap.js'
      - 'src/routes/staffCalendarAccessUx.js'
      - 'src/routes/workspaceOperational.js'
      - 'src/routes/calendar.js'
      - 'src/routes/webhook.js'
      - 'src/presentation/staffPasskeyUx.js'
      - 'src/presentation/staffPasskeyBootstrapUx.js'
      - 'tests/staff-passkey-auth-v1.test.js'
      - 'tests/staff-passkey-auth-v1-production-schema.test.js'
      - 'tests/staff-whatsapp-passkey-bootstrap-v1.test.js'
      - 'tests/staff-calendar-access-ux.test.js'
      - 'tests/workspace-reception-device-signin.test.js'
      - 'tests/reception-passkey-stale-recovery.test.js'
      - 'tests/reception-laptop-lock.test.js'
      - 'scripts/staff-passkey-auth-v1-browser-proof.js'
      - '.github/workflows/staff-passkey-auth-v1-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passkey_v1_proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Focused #794/#804/#808/#842/#932 security tests
        run: node --test tests/staff-passkey-auth-v1.test.js tests/staff-passkey-auth-v1-production-schema.test.js tests/staff-whatsapp-passkey-bootstrap-v1.test.js tests/staff-calendar-access-ux.test.js tests/workspace-reception-device-signin.test.js tests/reception-passkey-stale-recovery.test.js tests/reception-laptop-lock.test.js
      - name: Authenticated Desktop + Phone passkey proof
        run: node scripts/staff-passkey-auth-v1-browser-proof.js
      - uses: actions/upload-artifact@v7
        with:
          name: staff-passkey-auth-v1
          path: artifacts/staff-passkey-auth-v1
          if-no-files-found: error
          retention-days: 14
