name: Production Lighthouse

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit the live booking page
        run: npm run lighthouse:ci
      - name: Upload private Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-production-booking
          path: artifacts/lighthouse
          if-no-files-found: ignore
          retention-days: 14
