<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#465746">
  <title>My Shiloh | Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f3ec;color:#25332c;font-family:Inter,system-ui,sans-serif}.card{width:min(100%,430px);padding:28px;border-radius:26px;background:#fffdf9;border:1px solid rgba(37,51,44,.1);box-shadow:0 20px 55px rgba(48,61,52,.12)}.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#465746;color:white;font-family:Georgia,serif;font-size:28px}h1{font-family:Georgia,serif;font-weight:500;font-size:38px;line-height:1;margin:20px 0 12px}p{color:#66726b;line-height:1.55}.note{margin-top:22px;padding:12px 14px;border-radius:14px;background:#edf2e9;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">S</div>
    <h1>My Shiloh is offline.</h1>
    <p>Your private information is never stored in the offline shell. Reconnect to view the latest booking, form or payment information.</p>
    <div class="note">When your connection returns, reopen My Shiloh and everything will refresh from Shiloh.</div>
  </main>
</body>
</html>
